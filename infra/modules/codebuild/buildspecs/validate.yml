version: 0.2

env:
  variables:
    TERRAFORM_DIRECTORY: "."

phases:
  install:
    runtime-versions:
      terraform: $TF_VERSION
  pre_build:
    commands:
      - cd $TERRAFORM_DIRECTORY
  build:
    commands:
      - terraform init -input=false
      - terraform validate
  post_build:
    commands:
      - echo "Validation completed on $(date)"

artifacts:
  files:
    - "**/*"
  name: validate-$(date +%Y-%m-%d)
